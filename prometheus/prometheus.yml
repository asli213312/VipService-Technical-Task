global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]
      
  - job_name: "nginxlog-exporter"
    static_configs:
      - targets: ["nginxlog-exporter:4040"]
      
  - job_name: "docker-exporter"
    static_configs:
      - targets: ["cadvisor:8080"]