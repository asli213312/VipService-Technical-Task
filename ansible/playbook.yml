---
- name: Deploy
  hosts: servers
  become: yes
  vars:
    project_dir: /opt/vipservice
    
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
        state: present
        
    - name: Install Docker dependencies
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        
    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes
        
    - name: Ensure user exists
      user:
        name: deploy
        state: present
        shell: /bin/bash
        create_home: yes
        
    - name: Add deploy user to docker group
      user:
        name: deploy
        groups: docker
        append: yes
        
    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
        
    - name: Copy docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: deploy
        group: deploy
        mode: '0644'
      notify: restart services
    
    - name: Copy .env file (if exists)
      copy:
        src: .env
        dest: "{{ project_dir }}/.env"
        owner: deploy
        group: deploy
        mode: '0644'
      notify: restart services
      
    - name: Copy Nginx config
      copy:
        src: ../nginx/nginx.conf
        dest: "{{ project_dir }}/nginx.conf"
        owner: deploy
        group: deploy
        mode: '0644'
      notify: restart services

    - name: Copy Nginx log exporter config
      copy:
        src: ../nginx/nginxlog/nginxlog.hcl
        dest: "{{ project_dir }}/nginxlog.hcl"
        owner: deploy
        group: deploy
        mode: '0644'
      notify: restart services

    - name: Copy Prometheus config
      copy:
        src: ../prometheus/prometheus.yml
        dest: "{{ project_dir }}/prometheus.yml"
        owner: deploy
        group: deploy
        mode: '0644'
      notify: restart services

    - name: Copy Grafana provisioning files
      copy:
        src: ../grafana
        dest: "{{ project_dir }}/grafana/provisioning/"
        owner: deploy
        group: deploy
        mode: '0644'
      notify: restart services

    - name: Ensure docker-compose is present
      command: docker compose version
      register: compose_version
      changed_when: false

    - name: Start Docker containers
      docker_compose:
        project_src: "{{ project_dir }}"
        state: present
        restarted: yes
        pull: yes
      register: compose_up
      
    - name: Show compose status
      debug:
        msg: "Containers started: {{ compose-up }}"
  
  handlers:
    - name: restart services
      docker_compose:
        project_src: "{{ project_dir }}"
        restarted: yes

    