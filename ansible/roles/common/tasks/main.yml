---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [common, packages]

- name: Install base system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
      - python3-pip
      - python3-setuptools
      - rsync
    state: present
  tags: [common, packages]

- name: Ensure deploy user exists
  user:
    name: "{{ deploy_user }}"
    shell: "{{ deploy_user_shell }}"
    create_home: yes
    state: present
  tags: [common, user]
