events {}

http {
	server_tokens off;
	
	limit_req_zone $binary_remote_addr zone=limit:10m rate=2r/s;
	
	proxy_http_version 1.1;
	proxy_set_header Connection "keep-alive";
	
	server {
		listen 80;
		server_name _;
		
		access_log /var/log/nginx/access.log combined;
		
		location /ping {
			limit_req zone=limit burst=3 nodelay;
			limit_req_status 429;
		
			proxy_pass http://backend:8080;
			
			proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
		}
		
		# Always 200: hammer this path to generate RPS traffic
		location /load {
			return 200 "OK";
		}
		
		# Always 500: generates error responses to verify 5xx metrics,
		# error-rate panels and (optionally) alerts in Grafana.
		location /err {
			return 500 "Internal error";
		}
		
		location /status {
			stub_status;
			allow 127.0.0.1;
			allow 172.0.0.8/8; # Docker internal networks only
			
			deny all;
		}
	}
}